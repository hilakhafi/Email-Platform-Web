services:
  server:
    build:
      context: ./src/server
    container_name: server
    ports:
      - "8080:8080"
    tty: true
    stdin_open: true
    
  client:
    image: python:3.11
    build:
      context: ./src/client
    container_name: client
    volumes:
      - ./src/client:/app
    working_dir: /app
    depends_on:
      - server
    tty: true
    stdin_open: true
